<script>


const texts = [

"Detailed analysis and clear report structure.",

"Professional approach and good communication.",

"Useful connection mapping and timeline analysis."

];


const box =
document.getElementById("reviews");



for(let i=1;i<=50;i++){


let review =
document.createElement("div");


review.className="card";


review.innerHTML =

`
<h3>Review #${i}</h3>

<p>
${texts[Math.floor(Math.random()*texts.length)]}
</p>

<small>
2026
</small>
`;



box.appendChild(review);


}
